<!-- Generated by `wallii dash` — self-contained, no network access, data inlined below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wallii — agent wall dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --other: #c3c2b7;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --none: #c3c2b7;
    --accent: #2a78d6; --track: #cde2fb;
    --up: #006300; --down: #d03b3b;
    --h1: #cde2fb; --h2: #9ec5f4; --h3: #6da7ec; --h4: #3987e5; --h5: #256abf; --h6: #184f95;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
      --other: #52514e;
      --none: #383835;
      --accent: #3987e5; --track: #0d366b;
      --up: #0ca30c; --down: #d03b3b;
      --h1: #0d366b; --h2: #104281; --h3: #1c5cab; --h4: #256abf; --h5: #3987e5; --h6: #6da7ec;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --other: #52514e;
    --none: #383835;
    --accent: #3987e5; --track: #0d366b;
    --up: #0ca30c; --down: #d03b3b;
    --h1: #0d366b; --h2: #104281; --h3: #1c5cab; --h4: #256abf; --h5: #3987e5; --h6: #6da7ec;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 20px 20px 48px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .stamp { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  #theme {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }

  .filters { display: flex; gap: 6px; margin-bottom: 16px; }
  .filters button {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .filters button.on { color: var(--ink); font-weight: 650; border-color: var(--axis); }
  .filters button.on::before { content: "✓ "; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 10px; }
  .tile .lbl { font-size: 12px; color: var(--ink-2); }
  .tile .val { font-size: 24px; font-weight: 650; margin: 2px 0 0; }
  .tile .sub { font-size: 11.5px; color: var(--muted); min-height: 16px; }
  .tile .sub .up { color: var(--up); }
  .tile .sub .down { color: var(--down); }
  .tile svg { display: block; margin-top: 4px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 10px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 13px; font-weight: 650; margin: 0; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin: 1px 0 10px; }
  .card svg { display: block; width: 100%; height: auto; }
  .card svg.narrow { max-width: 500px; } /* small viewBoxes upscale their type when a card goes full-width */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); margin: 8px 0 2px; }
  .legend .k { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 26px 0 30px; text-align: center; }

  details.tv { margin: 6px -4px 2px; font-size: 12px; }
  details.tv summary { color: var(--muted); cursor: pointer; padding: 2px 4px; }
  details.tv table { border-collapse: collapse; margin: 6px 4px; font-variant-numeric: tabular-nums; }
  details.tv th, details.tv td { text-align: left; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--grid); font-weight: 400; }
  details.tv th { color: var(--muted); font-size: 11px; }
  details.tv td.n, details.tv th.n { text-align: right; }

  .meter { margin: 9px 0; }
  .meter .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
  .meter .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 4px; background: var(--accent); }

  table.agents { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.agents th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 500; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--grid); }
  table.agents td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--grid); }
  table.agents tr:last-child td { border-bottom: 0; }
  table.agents th.n, table.agents td.n { text-align: right; }

  .feed { font-size: 12.5px; }
  .feed .row { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
  .feed .row:last-child { border-bottom: 0; }
  .feed .when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed .repo { font-weight: 600; white-space: nowrap; }
  .feed .topic { color: var(--muted); white-space: nowrap; }
  .feed .msg { flex: 1; min-width: 200px; }
  .feed .grader { color: var(--muted); margin-top: 3px; }
  .feed .signal { color: var(--ink-2); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
  .feed a { color: var(--accent); text-decoration: none; }
  .badge { font-size: 10.5px; border-radius: 5px; padding: 1px 6px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.ok { color: var(--good); }
  .badge.partial { color: var(--warn); }
  .badge.failed { color: var(--crit); }

  #tt {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
    max-width: 260px;
  }
  #tt .t { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  #tt .l { display: flex; align-items: center; gap: 6px; }
  #tt .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  footer { margin-top: 22px; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>wallii — agent wall dashboard</h1>
    <span class="stamp">generated __GENERATED__ · local snapshot, refresh with <code>wallii dash</code></span>
    <span class="spacer"></span>
    <button id="theme" title="theme">auto</button>
  </header>

  <div class="filters" id="filters"></div>
  <div class="tiles" id="tiles"></div>

  <div class="grid">
    <div class="card wide" id="c-activity"></div>
    <div class="card" id="c-outcome"></div>
    <div class="card" id="c-mood"></div>
    <div class="card" id="c-heat"></div>
    <div class="card" id="c-coverage"></div>
    <div class="card" id="c-repos"></div>
    <div class="card" id="c-topics"></div>
    <div class="card wide" id="c-agents"></div>
    <div class="card wide" id="c-feed"></div>
  </div>

  <footer>every value in the charts is also in each card's table view · outcome / took / mood are optional post flags — the coverage card shows how much of the wall carries them</footer>
</div>
<div id="tt"></div>

<script>
"use strict";
const RAW = __WALLII_DATA__ || [];
RAW.sort((a, b) => a.t - b.t);

const DAY = 864e5;
const MOODS = { great: 5, good: 4, ok: 3, rough: 2, stuck: 1 };
const MOOD_WORDS = ["", "stuck", "rough", "ok", "good", "great"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* ---------- tiny DOM/SVG helpers ---------- */
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    if (attrs[k] == null) continue;
    if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const k of kids) n.append(k);
  return n;
}
function svgEl(tag, attrs, ...kids) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs || {}) {
    if (attrs[k] == null) continue;
    if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const k of kids) n.append(k);
  return n;
}
// stored field values (repo, actor, topic) are only control-char-filtered,
// not HTML-safe — escape before every innerHTML interpolation
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dayStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function fmtDay(t) { const d = new Date(t); return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fmtTook(s) {
  const m = Math.round(s / 60); // round once, then split — never yields 1h60m
  if (m < 60) return m + "m";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function niceMax(v) {
  if (v <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ---------- tooltip (enhances, never gates — table views carry the values) ---------- */
const tt = $("tt");
function ttShow(evt, html) {
  tt.innerHTML = html;
  tt.style.display = "block";
  ttMove(evt);
}
function ttMove(evt) {
  const pad = 14, w = tt.offsetWidth, h = tt.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tt.style.left = x + "px";
  tt.style.top = y + "px";
}
function ttHide() { tt.style.display = "none"; }
function hover(node, html) {
  node.addEventListener("mouseenter", e => ttShow(e, typeof html === "function" ? html() : html));
  node.addEventListener("mousemove", ttMove);
  node.addEventListener("mouseleave", ttHide);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); ttShow({ clientX: r.x + r.width / 2, clientY: r.y }, typeof html === "function" ? html() : html); });
  node.addEventListener("blur", ttHide);
}

/* ---------- actor → slot assignment: global over ALL loaded data, so
   switching the range never repaints a series (color follows the entity) ---------- */
const SLOT_VARS = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const FOLD = "…others"; // fold-group key; distinct from any real actor named "Other"
const actorTotals = {};
for (const e of RAW) actorTotals[e.actor || "—"] = (actorTotals[e.actor || "—"] || 0) + 1;
const actorOrder = Object.keys(actorTotals).sort((a, b) => actorTotals[b] - actorTotals[a] || a.localeCompare(b));
const actorSlot = {};
actorOrder.forEach((a, i) => { actorSlot[a] = i < SLOT_VARS.length ? SLOT_VARS[i] : "--other"; });
function actorSeriesNames() {
  const named = actorOrder.slice(0, SLOT_VARS.length);
  return actorOrder.length > SLOT_VARS.length ? [...named, FOLD] : named;
}

/* ---------- aggregation for the selected range ---------- */
function aggregate(rangeDays) {
  const now = Date.now();
  // walk calendar days (not ms arithmetic): a DST transition must neither
  // merge two days into one bucket nor shift every later label
  const startD = new Date(rangeDays ? now : (RAW.length ? RAW[0].t : now));
  startD.setHours(0, 0, 0, 0);
  if (rangeDays) startD.setDate(startD.getDate() - (rangeDays - 1));
  const today = new Date(now);
  today.setHours(0, 0, 0, 0);
  const spanDays = Math.round((today - startD) / DAY) + 1;
  const weekly = spanDays > 60;
  const since = startD.getTime();
  const evs = RAW.filter(e => e.t >= since);

  const buckets = [];
  const dayIdx = {}; // local calendar day → bucket index
  const cur = new Date(startD);
  for (let i = 0; cur <= today; i++) {
    const bi = weekly ? Math.floor(i / 7) : i;
    if (!buckets[bi]) buckets.push({ t0: cur.getTime(), byActor: {}, out: { ok: 0, partial: 0, failed: 0, none: 0 }, moodSum: 0, moodN: 0, posts: 0 });
    dayIdx[dayKey(cur)] = bi;
    cur.setDate(cur.getDate() + 1);
  }

  const agg = {
    since, evs, buckets, weekly,
    repoCounts: {}, topicCounts: {},
    heat: Array.from({ length: 7 }, () => new Array(24).fill(0)),
    actors: {},
    out: { ok: 0, partial: 0, failed: 0, none: 0 },
    moodSum: 0, moodN: 0, tookSum: 0, tookN: 0, tookAuto: 0, refsN: 0, outN: 0,
    moodCounts: {}, contra: 0,
  };
  for (const e of evs) {
    const b = buckets[dayIdx[dayKey(new Date(e.t))]];
    if (!b) continue; // future-dated post (clock skew) — feed still shows it
    const actor = e.actor || "—";
    const grp = actorSlot[actor] === "--other" ? FOLD : actor;
    b.posts++;
    b.byActor[grp] = (b.byActor[grp] || 0) + 1;
    // an outcome value this build doesn't know counts as unreported, matching Go's stats
    const o = agg.out[e.out] !== undefined ? e.out : "none";
    b.out[o]++;
    agg.out[o]++;
    if (o !== "none") agg.outN++;
    const ms = MOODS[e.mood] || 0;
    if (ms) { b.moodSum += ms; b.moodN++; agg.moodSum += ms; agg.moodN++; agg.moodCounts[e.mood] = (agg.moodCounts[e.mood] || 0) + 1; }
    if (e.took) { agg.tookSum += e.took; agg.tookN++; if (e.src === "auto") agg.tookAuto++; }
    if (e.vs) agg.contra++;
    if (e.refs && e.refs.length) agg.refsN++;
    agg.repoCounts[e.repo] = (agg.repoCounts[e.repo] || 0) + 1;
    agg.topicCounts[e.topic || "(untagged)"] = (agg.topicCounts[e.topic || "(untagged)"] || 0) + 1;
    const d = new Date(e.t);
    agg.heat[(d.getDay() + 6) % 7][d.getHours()]++;
    let a = agg.actors[actor];
    if (!a) a = agg.actors[actor] = { posts: 0, repos: {}, ok: 0, partial: 0, failed: 0, moodSum: 0, moodN: 0, refs: 0, last: 0 };
    a.posts++;
    a.repos[e.repo] = 1;
    if (o !== "none") a[o]++;
    if (ms) { a.moodSum += ms; a.moodN++; }
    if (e.refs && e.refs.length) a.refs++;
    a.last = Math.max(a.last, e.t);
  }
  // previous window of equal length, for tile deltas
  agg.prev = rangeDays ? RAW.filter(e => e.t >= since - rangeDays * DAY && e.t < since) : null;
  return agg;
}

/* ---------- table view twin (the WCAG-clean equivalent of each chart) ---------- */
function tableView(headers, rows) {
  const thead = el("tr", {});
  headers.forEach((h, i) => thead.append(el("th", { text: h, class: i ? "n" : "" })));
  const table = el("table", {}, thead);
  for (const r of rows) {
    const tr = el("tr", {});
    r.forEach((c, i) => tr.append(el("td", { text: c, class: i ? "n" : "" })));
    table.append(tr);
  }
  return el("details", { class: "tv" }, el("summary", { text: "table view" }), table);
}

function card(id, title, sub) {
  const c = $(id);
  c.replaceChildren(el("h2", { text: title }), el("div", { class: "sub", text: sub }));
  return c;
}
function legend(entries) {
  const l = el("div", { class: "legend" });
  for (const [name, colorVar, icon] of entries) {
    l.append(el("span", { class: "k" },
      el("span", { class: "sw", style: "background:var(" + colorVar + ")" }),
      el("span", { text: (icon ? icon + " " : "") + name })));
  }
  return l;
}

/* ---------- stacked column chart (activity, outcomes) ---------- */
function roundTop(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}
function stackedColumns(buckets, series, colorOf, labelOf, weekly) {
  const W = 720, H = 200, mL = 30, mB = 20, mT = 8;
  const plotW = W - mL - 6, plotH = H - mT - mB;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const maxTotal = Math.max(1, ...buckets.map(b => series.reduce((s, k) => s + (labelOf(b)[k] || 0), 0)));
  const yMax = niceMax(maxTotal);
  const y = v => mT + plotH - v / yMax * plotH;
  const nTicks = yMax % 4 === 0 ? 4 : 5; // tick values must land on clean integers
  for (let i = 0; i <= nTicks; i++) {
    const v = yMax / nTicks * i, yy = y(v);
    svg.append(svgEl("line", { x1: mL, x2: W - 6, y1: yy, y2: yy, stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
    if (i) svg.append(svgEl("text", { x: mL - 6, y: yy + 3.5, "text-anchor": "end", "font-size": 10, fill: "var(--muted)", text: String(v) }));
  }
  const band = plotW / buckets.length;
  const barW = Math.min(24, band * 0.72);
  const labelEvery = Math.ceil(buckets.length / 12);
  buckets.forEach((b, i) => {
    const x = mL + i * band + (band - barW) / 2;
    const vals = labelOf(b);
    const drawn = series.map((k, s) => ({ k, s, v: vals[k] || 0 })).filter(d => d.v);
    let yTop = mT + plotH;
    drawn.forEach((d, di) => {
      const h = d.v / yMax * plotH;
      yTop -= h;
      if (di === drawn.length - 1) {
        svg.append(svgEl("path", { d: roundTop(x, yTop, barW, Math.max(h, 1.5), 4), fill: `var(${colorOf(d.k, d.s)})` }));
      } else {
        // 2px surface gap sits above every non-top segment; the baseline stays flush
        svg.append(svgEl("rect", { x, y: yTop + 2, width: barW, height: Math.max(h - 2, 1.5), fill: `var(${colorOf(d.k, d.s)})` }));
      }
    });
    if (i % labelEvery === 0) {
      svg.append(svgEl("text", { x: mL + i * band + band / 2, y: H - 6, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)", text: (weekly ? "wk " : "") + fmtDay(b.t0) }));
    }
    // hover hit target: the full band, never the thin mark
    const hit = svgEl("rect", { x: mL + i * band, y: mT, width: band, height: plotH, fill: "transparent", tabindex: "0" });
    hover(hit, () => {
      let html = `<div class="t">${weekly ? "week of " : ""}${fmtDay(b.t0)}</div>`;
      for (let d = drawn.length - 1; d >= 0; d--) {
        html += `<div class="l"><span class="sw" style="background:var(${colorOf(drawn[d].k, drawn[d].s)})"></span>${esc(drawn[d].k)} · ${drawn[d].v}</div>`;
      }
      return html + (drawn.length ? "" : "<div class='l'>no posts</div>");
    });
    svg.append(hit);
  });
  return svg;
}

/* ---------- charts ---------- */
function renderActivity(agg) {
  const c = card("c-activity", "Who's posting", (agg.weekly ? "posts per week" : "posts per day") + " by actor");
  if (!agg.evs.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const series = actorSeriesNames();
  const colorOf = name => name === FOLD ? "--other" : actorSlot[name];
  c.append(stackedColumns(agg.buckets, series, colorOf, b => b.byActor, agg.weekly));
  if (series.length > 1) c.append(legend(series.map(s => [s, colorOf(s)])));
  c.append(tableView(["", ...series],
    agg.buckets.filter(b => b.posts).map(b => [fmtDay(b.t0), ...series.map(s => b.byActor[s] || 0)])));
}

function renderOutcome(agg) {
  const c = card("c-outcome", "Does it land", "reported outcome per " + (agg.weekly ? "week" : "day"));
  if (!agg.evs.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const series = ["ok", "partial", "failed", "none"];
  const colors = { ok: "--good", partial: "--warn", failed: "--crit", none: "--none" };
  c.append(stackedColumns(agg.buckets, series, s => colors[s], b => b.out, agg.weekly));
  c.append(legend([["landed", "--good", "✓"], ["partial", "--warn", "◐"], ["failed", "--crit", "✕"], ["unreported", "--none", "○"]]));
  c.append(tableView(["", "landed", "partial", "failed", "unreported"],
    agg.buckets.filter(b => b.posts).map(b => [fmtDay(b.t0), b.out.ok, b.out.partial, b.out.failed, b.out.none])));
}

function renderMood(agg) {
  const c = card("c-mood", "How it feels", "friction report — great (5) = first try, stuck (1) = blocked");
  const pts = agg.buckets.map((b, i) => b.moodN ? { i, avg: b.moodSum / b.moodN, n: b.moodN, t0: b.t0 } : null).filter(Boolean);
  if (!pts.length) {
    c.append(el("div", { class: "empty", text: "no mood data yet — agents post it with --mood great|good|ok|rough|stuck" }));
    return;
  }
  const W = 360, H = 190, mL = 44, mB = 20, mT = 10, mR = 40;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", class: "narrow" });
  const x = i => mL + (agg.buckets.length === 1 ? plotW / 2 : i / (agg.buckets.length - 1) * plotW);
  const y = v => mT + plotH - (v - 1) / 4 * plotH;
  for (let v = 1; v <= 5; v++) {
    svg.append(svgEl("line", { x1: mL, x2: W - mR, y1: y(v), y2: y(v), stroke: v === 1 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    svg.append(svgEl("text", { x: mL - 6, y: y(v) + 3.5, "text-anchor": "end", "font-size": 10, fill: "var(--muted)", text: MOOD_WORDS[v] }));
  }
  // line only between adjacent buckets, so a data gap stays a visible gap
  for (let k = 1; k < pts.length; k++) {
    if (pts[k].i - pts[k - 1].i === 1) {
      svg.append(svgEl("line", { x1: x(pts[k - 1].i), y1: y(pts[k - 1].avg), x2: x(pts[k].i), y2: y(pts[k].avg), stroke: "var(--s1)", "stroke-width": 2, "stroke-linecap": "round" }));
    }
  }
  for (const p of pts) {
    svg.append(svgEl("circle", { cx: x(p.i), cy: y(p.avg), r: 6, fill: "var(--surface)" })); // 2px surface ring
    const dot = svgEl("circle", { cx: x(p.i), cy: y(p.avg), r: 4, fill: "var(--s1)", tabindex: "0" });
    hover(dot, `<div class="t">${fmtDay(p.t0)}</div><div class="l">${MOOD_WORDS[Math.round(p.avg)]} (${p.avg.toFixed(1)}) from ${p.n} post${p.n > 1 ? "s" : ""}</div>`);
    svg.append(dot);
  }
  const last = pts[pts.length - 1];
  svg.append(svgEl("text", { x: Math.min(x(last.i) + 10, W - 4), y: y(last.avg) + 3.5, "font-size": 10.5, fill: "var(--ink-2)", text: MOOD_WORDS[Math.round(last.avg)] }));
  c.append(svg);
  c.append(tableView(["", "avg", "posts"], pts.map(p => [fmtDay(p.t0), p.avg.toFixed(1), p.n])));
}

function renderHeat(agg) {
  const c = card("c-heat", "When they work", "posts by weekday × hour, local time");
  if (!agg.evs.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const max = Math.max(1, ...agg.heat.flat());
  const cell = 12.5, gap = 2, mL = 32, mT = 4;
  const W = mL + 24 * (cell + gap) + 4, H = mT + 7 * (cell + gap) + 18;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", class: "narrow" });
  const heatVar = v => "--h" + Math.min(6, Math.max(1, Math.ceil(v / max * 6)));
  for (let d = 0; d < 7; d++) {
    svg.append(svgEl("text", { x: mL - 6, y: mT + d * (cell + gap) + cell - 2.5, "text-anchor": "end", "font-size": 9.5, fill: "var(--muted)", text: WDAYS[d] }));
    for (let h = 0; h < 24; h++) {
      const v = agg.heat[d][h];
      const r = svgEl("rect", {
        x: mL + h * (cell + gap), y: mT + d * (cell + gap), width: cell, height: cell, rx: 2.5,
        fill: v ? `var(${heatVar(v)})` : "var(--grid)", "fill-opacity": v ? 1 : 0.45, tabindex: v ? "0" : null,
      });
      hover(r, `<div class="t">${WDAYS[d]} ${h}:00–${h + 1}:00</div><div class="l">${v} post${v === 1 ? "" : "s"}</div>`);
      svg.append(r);
    }
  }
  for (const h of [0, 6, 12, 18]) {
    svg.append(svgEl("text", { x: mL + h * (cell + gap) + cell / 2, y: H - 5, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)", text: h + ":00" }));
  }
  c.append(svg);
  c.append(tableView(["", "posts"],
    agg.heat.flatMap((row, d) => row.map((v, h) => v ? [`${WDAYS[d]} ${h}:00`, v] : null).filter(Boolean))));
}

function renderBars(id, title, sub, counts) {
  const c = card(id, title, sub);
  const items = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (!items.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const top = items.slice(0, 9);
  const rest = items.slice(9);
  if (rest.length) top.push([`Other (${rest.length})`, rest.reduce((s, r) => s + r[1], 0)]);
  const rowH = 22, mL = 150, mR = 34, W = 420, H = top.length * rowH + 6;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", class: "narrow" });
  const max = Math.max(...top.map(r => r[1])); // the folded Other row can exceed every single item
  top.forEach(([name, v], i) => {
    const y = 3 + i * rowH, barW = Math.max(v / max * (W - mL - mR), 2), h = 13;
    svg.append(svgEl("text", { x: mL - 8, y: y + h - 2.5, "text-anchor": "end", "font-size": 11, fill: "var(--ink-2)", text: name.length > 20 ? name.slice(0, 19) + "…" : name }));
    const bar = svgEl("path", { d: `M${mL},${y} L${mL + barW - 4},${y} Q${mL + barW},${y} ${mL + barW},${y + 4} L${mL + barW},${y + h - 4} Q${mL + barW},${y + h} ${mL + barW - 4},${y + h} L${mL},${y + h} Z`, fill: "var(--s1)" });
    hover(bar, `<div class="l">${esc(name)} · ${v} post${v === 1 ? "" : "s"}</div>`);
    svg.append(bar);
    svg.append(svgEl("text", { x: mL + barW + 6, y: y + h - 2.5, "font-size": 11, fill: "var(--ink-2)", text: String(v) }));
  });
  c.append(svg);
  c.append(tableView(["", "posts"], items.map(([n, v]) => [n, v])));
}

function renderCoverage(agg) {
  const c = card("c-coverage", "What the wall doesn't know yet", "share of posts carrying each optional field");
  const n = agg.evs.length;
  if (!n) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const derived = agg.tookAuto ? ` · ${agg.tookAuto} derived, ${agg.tookN - agg.tookAuto} measured` : "";
  const rows = [
    ["outcome (--outcome)", agg.outN, ""],
    ["mood (--mood)", agg.moodN, ""],
    ["duration (--took)", agg.tookN, derived],
    ["evidence link (--ref)", agg.refsN, ""],
  ];
  for (const [label, v, note] of rows) {
    c.append(el("div", { class: "meter" },
      el("div", { class: "row" }, el("span", { text: label }), el("span", { text: `${v}/${n} · ${pct(v, n)}%${note}` })),
      el("div", { class: "track" }, el("div", { class: "fill", style: `width:${pct(v, n)}%` }))));
  }
  c.append(el("div", { class: "sub", style: "margin-top:10px", text: "ratios above (landed %, mood) are computed over reporting posts only — low coverage means a small sample, not a healthy fleet" }));

  // Full coverage of a single value is not a measurement either. Unused
  // values stay listed at zero on purpose: the gap is the finding.
  const outUsed = ["ok", "partial", "failed"].filter(k => agg.out[k] > 0).length;
  const moodUsed = Object.keys(agg.moodCounts).length;
  if (agg.outN || agg.moodN) {
    const spread = el("div", { class: "sub", style: "margin-top:14px;padding-top:12px;border-top:1px solid var(--border)" });
    spread.append(el("div", { style: "color:var(--ink-2);font-weight:600", text: `calibration — outcome ${outUsed} of 3 values · mood ${moodUsed} of 5` }));
    spread.append(el("div", { style: "margin-top:5px", text: ["ok", "partial", "failed"].map(k => `${k} ${agg.out[k]}`).join(" · ") }));
    spread.append(el("div", { text: ["great", "good", "ok", "rough", "stuck"].map(k => `${k} ${agg.moodCounts[k] || 0}`).join(" · ") }));
    const gaps = [];
    if (agg.outN && !agg.out.failed) gaps.push("nothing ever failed");
    if (agg.moodN && !agg.moodCounts.rough && !agg.moodCounts.stuck) gaps.push("mood never went below ok");
    spread.append(el("div", { style: "margin-top:5px", text: gaps.length ? `${gaps.join(", ")} — a scale that never points down measures nothing` : "both scales reach their low end — the ratios above describe a spread" }));
    // nothing stops a contradicting post from being written — this is where it surfaces
    if (agg.contra) spread.append(el("div", { style: "margin-top:5px", text: `${agg.contra} post${agg.contra === 1 ? "" : "s"} tell a rougher story than their grade — those are the honest ones, read them` }));
    c.append(spread);
  }
}

function renderAgents(agg) {
  const c = card("c-agents", "The agents", "per actor, across all repos in range · landed % is over outcome-reporting posts");
  const names = Object.keys(agg.actors).sort((a, b) => agg.actors[b].posts - agg.actors[a].posts || a.localeCompare(b));
  if (!names.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const table = el("table", { class: "agents" },
    el("tr", {}, el("th", { text: "actor" }), el("th", { text: "posts", class: "n" }), el("th", { text: "repos", class: "n" }),
      el("th", { text: "landed", class: "n" }), el("th", { text: "mood", class: "n" }), el("th", { text: "refs", class: "n" }), el("th", { text: "last post", class: "n" })));
  for (const name of names) {
    const a = agg.actors[name];
    const rep = a.ok + a.partial + a.failed;
    const swatch = el("span", { class: "sw", style: `display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;background:var(${actorSlot[name] || "--other"})` });
    table.append(el("tr", {},
      el("td", {}, swatch, el("span", { text: name })),
      el("td", { text: String(a.posts), class: "n" }),
      el("td", { text: String(Object.keys(a.repos).length), class: "n" }),
      el("td", { text: rep ? pct(a.ok, rep) + "%" : "—", class: "n" }),
      el("td", { text: a.moodN ? (a.moodSum / a.moodN).toFixed(1) : "—", class: "n" }),
      el("td", { text: pct(a.refs, a.posts) + "%", class: "n" }),
      el("td", { text: fmtDay(a.last), class: "n" })));
  }
  c.append(table);
}

function renderFeed(agg) {
  const c = card("c-feed", "Latest posts", "the newest 15 in range — the wall itself has the full story");
  const evs = agg.evs.slice(-15).reverse();
  if (!evs.length) { c.append(el("div", { class: "empty", text: "no posts in this range" })); return; }
  const feed = el("div", { class: "feed" });
  for (const e of evs) {
    const d = new Date(e.t);
    const msg = el("span", { class: "msg", text: e.msg });
    // the poster's own words on the cheap path, under the message — quoted as written, never counted
    if (e.grader) msg.append(el("div", { class: "grader", text: "↷ " + e.grader }));
    // and beside them what the session's diff showed, the measurement the
    // poster did not write: same restraint, no count, no comparison drawn
    for (const s of e.signals || []) msg.append(el("div", { class: "signal", text: "⌇ " + s }));
    const row = el("div", { class: "row" },
      el("span", { class: "when", text: `${fmtDay(e.t)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` }),
      el("span", { class: "repo", text: e.repo }),
      el("span", { class: "topic", text: e.topic || "" }),
      msg);
    if (e.out) row.append(el("span", { class: "badge " + e.out, text: e.out === "ok" ? "✓ landed" : e.out === "partial" ? "◐ partial" : "✕ failed" }));
    if (e.mood) row.append(el("span", { class: "badge", text: e.mood }));
    if (e.took) row.append(el("span", { class: "badge", text: fmtTook(e.took) }));
    for (const [i, u] of (e.refs || []).entries()) {
      if (/^https?:\/\//.test(u)) row.append(el("a", { href: u, target: "_blank", rel: "noopener", text: "↗" + (e.refs.length > 1 ? i + 1 : "") }));
    }
    feed.append(row);
  }
  c.append(feed);
}

/* ---------- KPI tiles ---------- */
function sparkline(buckets) {
  const pts = buckets.slice(-12);
  const W = 100, H = 26, max = Math.max(1, ...pts.map(b => b.posts));
  const x = i => pts.length === 1 ? W / 2 : i / (pts.length - 1) * (W - 6) + 3;
  const y = v => H - 4 - v / max * (H - 8);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  svg.append(svgEl("polyline", { points: pts.map((b, i) => `${x(i)},${y(b.posts)}`).join(" "), fill: "none", stroke: "var(--axis)", "stroke-width": 1.5, "stroke-linejoin": "round" }));
  svg.append(svgEl("circle", { cx: x(pts.length - 1), cy: y(pts[pts.length - 1].posts), r: 3, fill: "var(--accent)" }));
  return svg;
}
function tile(label, value, sub, extra) {
  const t = el("div", { class: "tile" }, el("div", { class: "lbl", text: label }), el("div", { class: "val", text: value }));
  const s = el("div", { class: "sub" });
  if (sub) s.append(sub);
  t.append(s);
  if (extra) t.append(extra);
  return t;
}
function delta(cur, prevAgg, get, upIsGood, unit) {
  if (!prevAgg || !prevAgg.length) return null;
  const prev = get(prevAgg);
  if (prev == null) return null;
  const d = cur - prev;
  if (!isFinite(d)) return null;
  const span = el("span", {});
  const sign = d > 0 ? "+" : "";
  const cls = d === 0 ? "" : (d > 0) === upIsGood ? "up" : "down";
  span.append(el("span", { class: cls, text: `${sign}${Math.round(d)}${unit || ""}` }), el("span", { text: " vs prev. window" }));
  return span;
}
function renderTiles(agg) {
  const box = $("tiles");
  box.replaceChildren();
  const n = agg.evs.length;
  const rep = agg.out.ok + agg.out.partial + agg.out.failed;
  box.append(tile("Posts", String(n), delta(n, agg.prev, p => p.length, true), n ? sparkline(agg.buckets) : null));
  const landed = rep ? pct(agg.out.ok, rep) + "%" : "—";
  const prevLanded = p => {
    const r = p.filter(e => e.out);
    if (!r.length) return null;
    return pct(r.filter(e => e.out === "ok").length, r.length);
  };
  box.append(tile("Landed", landed, rep ? delta(pct(agg.out.ok, rep), agg.prev, prevLanded, true, " pts") : el("span", { text: "no outcomes reported" })));
  box.append(tile("Failed", String(agg.out.failed), el("span", { text: agg.out.partial + " partial" })));
  box.append(tile("Mood", agg.moodN ? MOOD_WORDS[Math.round(agg.moodSum / agg.moodN)] : "—",
    el("span", { text: agg.moodN ? `avg ${(agg.moodSum / agg.moodN).toFixed(1)} from ${agg.moodN} post${agg.moodN > 1 ? "s" : ""}` : "no --mood posts yet" })));
  box.append(tile("Evidence", pct(agg.refsN, n) + "%", el("span", { text: `${agg.refsN}/${n} posts link a ref` })));
  box.append(tile("Time logged", agg.tookN ? fmtTook(agg.tookSum) : "—",
    el("span", { text: agg.tookN ? `across ${agg.tookN} post${agg.tookN > 1 ? "s" : ""}` : "no --took posts yet" })));
}

/* ---------- range filter + boot ---------- */
const RANGES = [["7d", 7], ["30d", 30], ["90d", 90], ["all", 0]];
let currentRange = 30;
function renderAll() {
  const agg = aggregate(currentRange);
  renderTiles(agg);
  renderActivity(agg);
  renderOutcome(agg);
  renderMood(agg);
  renderHeat(agg);
  renderCoverage(agg);
  renderBars("c-repos", "Where the work happens", "posts per repo", agg.repoCounts);
  renderBars("c-topics", "What kind of work", "posts per topic", agg.topicCounts);
  renderAgents(agg);
  renderFeed(agg);
}
function renderFilters() {
  const f = $("filters");
  f.replaceChildren();
  for (const [label, days] of RANGES) {
    f.append(el("button", {
      class: days === currentRange ? "on" : "",
      text: label,
      onclick: () => { currentRange = days; renderFilters(); renderAll(); },
    }));
  }
}

/* theme toggle: auto → light → dark, persisted. localStorage can throw on
   file:// (Safari) or with cookies blocked — the dashboard must render anyway */
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* not persisted */ } }
const themeBtn = $("theme");
function applyTheme(mode) {
  if (mode === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  themeBtn.textContent = mode;
  lsSet("wallii-theme", mode);
}
themeBtn.addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  const cur = lsGet("wallii-theme") || "auto";
  applyTheme(order[(order.indexOf(cur) + 1) % 3]);
});
applyTheme(lsGet("wallii-theme") || "auto");

renderFilters();
renderAll();
</script>
</body>
</html>
